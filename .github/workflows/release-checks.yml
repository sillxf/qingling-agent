name: Release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install constrained development dependencies
        run: python -m pip install -c requirements/constraints.txt -e ".[dev]"
      - name: Check dependencies and basic correctness
        run: |
          python -m pip check
          python -m ruff check app tests scripts
      - name: Run all tests
        run: python -m pytest -q -o addopts='' -p no:cacheprovider
      - name: Run offline acceptance demo
        run: python -m app.demo --output artifacts/demo.json
      - name: Build sdist and wheel
        run: python -m build
      - name: Smoke-test installed wheel outside checkout
        run: python scripts/ci_wheel_smoke.py
