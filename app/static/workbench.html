<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>青灵 · Workflow 工作台</title>
<style>
:root{font-family:system-ui,sans-serif;color:#233044;background:#f5f7fa;font-size:14px}*{box-sizing:border-box}body{margin:0}header{padding:16px 22px;background:white;border-bottom:1px solid #dbe1e9;display:flex;align-items:center;gap:14px}h1{font-size:20px;margin:0 auto 0 0}h2{font-size:16px;margin:0 0 14px}button,input,select,textarea{font:inherit;border:1px solid #bdc7d5;border-radius:5px;padding:7px;background:white;color:inherit}button{cursor:pointer}button:hover{border-color:#2466ca}button:focus-visible,input:focus,select:focus,textarea:focus{outline:2px solid #2466ca;outline-offset:2px}button.primary{background:#2466ca;color:white;border-color:#2466ca}button:disabled{opacity:.5;cursor:default}label{display:block;margin:10px 0 4px;font-size:12px;color:#52647b}textarea{width:100%;min-height:100px;font-family:ui-monospace,monospace;resize:vertical}input,select{max-width:100%}.bar{padding:12px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #dbe1e9}.bar input{width:155px}.workspace{display:grid;grid-template-columns:235px minmax(440px,1fr) 320px;min-height:570px;height:66vh}.pane{background:white;padding:16px;overflow:auto;border-right:1px solid #dbe1e9}.item{padding:10px 0;border-bottom:1px solid #e3e8ef}.item small{display:block;color:#62748b;margin:5px 0;overflow-wrap:anywhere}.item button{padding:4px 9px;margin-right:4px}.canvas-wrap{overflow:auto;position:relative;background:#f2f5f9}.canvas{width:1500px;height:1100px;position:relative;background-image:radial-gradient(#ccd5e0 1px,transparent 1px);background-size:20px 20px}.node{position:absolute;width:182px;min-height:86px;background:white;border:1px solid #a9b8cc;border-radius:7px;padding:11px;text-align:left;touch-action:none;cursor:grab}.node.selected{border:2px solid #2466ca}.node small{display:block;font-size:11px;color:#687c95;margin-top:6px;overflow-wrap:anywhere}.node[data-status=succeeded]{border-color:#248066}.node[data-status=skipped]{opacity:.45}.node[data-status=running]{background:#eaf2ff}.node[data-status=failed]{border-color:#bd3343}svg{position:absolute;inset:0;pointer-events:none}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;margin:0}#notice{padding:10px 22px;min-height:38px;border-bottom:1px solid #dbe1e9;background:#fff;color:#375575}.error{color:#b32636!important}.row{display:flex;gap:6px;align-items:center;margin:8px 0}.row>*{min-width:0;flex:1}.edges button{font-size:11px;display:block;width:100%;text-align:left;margin:5px 0;overflow-wrap:anywhere}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:18px 22px;background:white;border-top:1px solid #dbe1e9}.muted{font-size:12px;color:#63768e}details{margin:12px 0}#runResult{max-height:260px;overflow:auto}#configFields input{width:100%}.small{min-height:65px}@media(max-width:1000px){.workspace{grid-template-columns:190px 1fr;height:65vh}.inspector{grid-column:1/-1;max-height:300px}.bottom{margin-top:300px}header{flex-wrap:wrap}.bottom{grid-template-columns:1fr}}
</style>
<header><h1>青灵 · Workflow 工作台</h1><span class="muted">组件 → 连线 → 校验 → 发布 → 执行</span><input id="token" type="password" aria-label="Bearer Token" placeholder="Bearer Token（启用鉴权时）" autocomplete="off"><button id="refresh">连接 / 刷新</button></header>
<div class="bar"><select id="saved" aria-label="已有流程"><option>选择已有流程</option></select><button id="load">加载</button><button id="new">新建</button><input id="workflowId" aria-label="Workflow ID" value="my-workflow"><input id="version" aria-label="Workflow 版本" value="1.0.0"><input id="owner" aria-label="所属租户" placeholder="所属租户（留空为公共）"><button id="save">保存草稿</button><button id="validate">校验</button><button id="publish" class="primary">发布版本</button><button id="activate">启用 / 回滚到此版</button><button id="disable">停用新请求</button><button id="export">导出</button><button id="import">导入</button><input id="file" type="file" accept="application/json,.json" hidden></div>
<div id="notice" role="status" aria-live="polite">连接服务后，选择组件开始编排。</div>
<div class="workspace"><aside class="pane"><h2>组件目录</h2><input id="search" type="search" aria-label="搜索组件" placeholder="搜索名称 / 功能"><div id="catalog"></div><details><summary>注册已安装实现</summary><p class="muted">上传组件清单，implementation 指向已安装的组件及版本。代码由开发者部署。</p><textarea id="manifest" aria-label="组件注册清单"></textarea><button id="register">注册组件</button></details></aside>
<main class="canvas-wrap" aria-label="流程画布"><div id="canvas" class="canvas"><svg width="1500" height="1100" id="lines"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d83a0"/></marker></defs></svg><div id="nodes"></div></div></main>
<aside class="pane inspector"><h2>节点与端口</h2><div id="selectedTitle" class="muted">选择节点编辑</div><label for="nodeId">节点 ID</label><input id="nodeId"><div class="row"><button id="entry">设为入口</button><button id="exit">设为出口</button><button id="remove">删除</button></div><div class="row"><label>汇聚<select id="join"><option value="all">等待全部有效分支</option><option value="any">等待全部结束，取有效分支</option></select></label><label>失败策略<select id="onError"><option value="fail">终止</option><option value="skip">跳过</option><option value="route">错误端口</option></select></label></div><div id="configFields"></div><details><summary>输入绑定与附加契约</summary><label for="bindings">输入绑定（value 常量 / request 请求字段）</label><textarea id="bindings" class="small">{}</textarea><label for="nodeSchema">附加输入契约</label><textarea id="nodeSchema" class="small">{}</textarea></details><button id="apply">应用节点配置</button><hr><h2>添加连线</h2><div class="row"><select id="fromNode" aria-label="源节点"></select><select id="fromPort" aria-label="输出端口"></select></div><div class="row"><select id="toNode" aria-label="目标节点"></select><input id="toPort" list="inputPorts" aria-label="输入端口" placeholder="输入端口"><datalist id="inputPorts"></datalist></div><button id="connect">连接并校验</button><div id="edges" class="edges"></div><details><summary>流程契约与并发</summary><label for="inputSchema">请求 Schema</label><textarea id="inputSchema">{"type":"object"}</textarea><label for="outputSchema">结果 Schema</label><textarea id="outputSchema">{"type":"object"}</textarea><label for="parallel">最大并发</label><input id="parallel" type="number" min="1" max="16" value="4"><button id="applySchema">应用流程契约</button></details></aside></div>
<section class="bottom"><div><h2>验证与执行</h2><pre id="validation">尚未校验</pre><div class="row"><input id="runTenant" aria-label="运行租户" placeholder="运行租户" value="tenant-a"><select id="profile" aria-label="执行权限配置"></select></div><label for="runInput">样例输入</label><textarea id="runInput">{"message":"分析资产安全"}</textarea><button id="execute" class="primary">执行当前发布版本</button><button id="cancel" disabled>取消运行</button><button id="approve" hidden>批准待执行节点</button><button id="reject" hidden>拒绝</button></div><div><h2>运行记录</h2><pre id="runResult">执行后显示节点状态、耗时、结果及错误。</pre></div></section>
<script>
'use strict';
const $=id=>document.getElementById(id);let components=[],saved=[],selected=null,revision=0,runId=null,poll=null,currentRun=null;
const blank=()=>({id:'my-workflow',version:'1.0.0',entry:'',exit:'',nodes:[],edges:[],input_schema:{type:'object'},output_schema:{type:'object'},max_parallel:4});let flow=blank();
function notice(text,error=false){$('notice').textContent=text;$('notice').classList.toggle('error',error)}
async function api(path,method='GET',body){const headers={};if($('token').value)headers.Authorization='Bearer '+$('token').value;if(body!==undefined)headers['Content-Type']='application/json';const response=await fetch(path,{method,headers,body:body===undefined?undefined:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.error||data.detail||data));return data}
function action(id,fn){$(id).onclick=async()=>{try{await fn()}catch(e){notice(e.message,true)}}}
function option(parent,value,label){const o=document.createElement('option');o.value=value;o.textContent=label;parent.append(o)}
function component(node){return components.find(c=>c.id===node.component&&c.version===node.version)}
function meta(){flow.id=$('workflowId').value.trim();flow.version=$('version').value.trim();flow.tenant_id=$('owner').value.trim()||null;return flow}
function load(value,rev=0){flow=structuredClone(value);flow.edges=flow.edges.map(e=>({from:e.from||e.from_ref,to:e.to||e.to_ref}));revision=rev;selected=null;$('workflowId').value=flow.id;$('version').value=flow.version;$('owner').value=flow.tenant_id||'';$('inputSchema').value=JSON.stringify(flow.input_schema||{},null,2);$('outputSchema').value=JSON.stringify(flow.output_schema||{},null,2);$('parallel').value=flow.max_parallel||4;render();inspect();notice('已加载。修改发布版本后，请使用新版本号发布。')}
async function refresh(){components=await api('/v1/components');const data=await api('/v1/workbench/workflows');saved=[...data.published.map(w=>({workflow:w,label:'已发布 '+w.id+' @ '+w.version})),...data.drafts.map(r=>({workflow:r.payload,revision:r.revision,label:'草稿 '+r.id+' @ '+r.version}))];$('saved').replaceChildren();saved.forEach((v,i)=>option($('saved'),i,v.label));const profiles=await api('/v1/agents');$('profile').replaceChildren();profiles.filter(p=>p.enabled).forEach(p=>option($('profile'),p.id,p.name));catalog();render();notice('已连接，组件 '+components.length+' 个。')}
function catalog(){const q=$('search').value.toLowerCase();$('catalog').replaceChildren();for(const c of components.filter(c=>(c.id+' '+c.description+' '+c.display_name).toLowerCase().includes(q))){const div=document.createElement('div');div.className='item';const title=document.createElement('strong');title.textContent=c.display_name||c.id;const sub=document.createElement('small');sub.textContent=c.id+' @ '+c.version+' · '+c.state+' · '+c.security.permission;const add=document.createElement('button');add.textContent='添加';add.disabled=!c.available||c.state!=='published';add.onclick=()=>{let id='node'+(flow.nodes.length+1);while(flow.nodes.some(n=>n.id===id))id+='a';flow.nodes.push({id,component:c.id,version:c.version,config:Object.fromEntries(Object.entries(c.config_schema.properties||{}).filter(([,v])=>'default'in v).map(([k,v])=>[k,v.default])),bindings:{},position:{x:50+(flow.nodes.length%4)*230,y:50+Math.floor(flow.nodes.length/4)*160}});if(c.id==='input')flow.entry=id;if(c.id==='output')flow.exit=id;selected=id;render();inspect()};const info=document.createElement('button');info.textContent='清单';info.onclick=()=>{$('manifest').value=JSON.stringify(Object.fromEntries(Object.entries(c).filter(([k])=>!['state','available','references'].includes(k))),null,2);$('validation').textContent=JSON.stringify(c,null,2)};const state=document.createElement('button');state.textContent=c.state==='disabled'?'启用':'禁用';state.onclick=async()=>{try{await api('/v1/components/'+encodeURIComponent(c.id)+'/'+c.version+'/state','PUT',{state:c.state==='disabled'?'published':'disabled'});await refresh()}catch(e){notice(e.message,true)}};div.append(title,sub,add,info,state);$('catalog').append(div)}}
function render(){const holder=$('nodes');holder.replaceChildren();flow.nodes.forEach((n,i)=>{if(!n.position||!Number.isFinite(n.position.x))n.position={x:50+(i%4)*230,y:50+Math.floor(i/4)*160};const b=document.createElement('button');b.className='node'+(selected===n.id?' selected':'');b.style.left=n.position.x+'px';b.style.top=n.position.y+'px';b.dataset.node=n.id;b.textContent=n.id+(n.id===flow.entry?' · 入口':'')+(n.id===flow.exit?' · 出口':'');const small=document.createElement('small');small.textContent=n.component+' @ '+n.version;b.append(small);b.onclick=()=>{selected=n.id;inspect();for(const el of holder.children)el.classList.toggle('selected',el.dataset.node===n.id)};b.onpointerdown=e=>{if(e.button!==0)return;const start={x:e.clientX,y:e.clientY,...n.position};const sx=e.clientX,sy=e.clientY,ox=n.position.x,oy=n.position.y;b.setPointerCapture(e.pointerId);b.onpointermove=ev=>{n.position={x:Math.max(0,Math.min(1280,ox+ev.clientX-sx)),y:Math.max(0,Math.min(980,oy+ev.clientY-sy))};b.style.left=n.position.x+'px';b.style.top=n.position.y+'px';draw()};b.onpointerup=()=>{b.onpointermove=null}};holder.append(b)});draw();const from=$('fromNode').value,to=$('toNode').value;for(const id of ['fromNode','toNode']){$(id).replaceChildren();flow.nodes.forEach(n=>option($(id),n.id,n.id))}if(flow.nodes.some(n=>n.id===from))$('fromNode').value=from;if(flow.nodes.some(n=>n.id===to))$('toNode').value=to;ports();$('edges').replaceChildren();flow.edges.forEach((e,i)=>{const b=document.createElement('button');b.textContent=e.from.node+'.'+e.from.port+' → '+e.to.node+'.'+e.to.port+' ×';b.title='删除此连线';b.onclick=()=>{flow.edges.splice(i,1);render()};$('edges').append(b)})}
function draw(){const svg=$('lines');for(const e of [...svg.querySelectorAll('path.link')])e.remove();for(const edge of flow.edges){const a=flow.nodes.find(n=>n.id===edge.from.node),b=flow.nodes.find(n=>n.id===edge.to.node);if(!a||!b)continue;const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('class','link');p.setAttribute('d',`M ${a.position.x+182} ${a.position.y+42} C ${a.position.x+220} ${a.position.y+42}, ${b.position.x-38} ${b.position.y+42}, ${b.position.x} ${b.position.y+42}`);p.setAttribute('stroke','#6d83a0');p.setAttribute('stroke-width','2');p.setAttribute('fill','none');p.setAttribute('marker-end','url(#arrow)');svg.append(p)}}
function ports(){const from=flow.nodes.find(n=>n.id===$('fromNode').value),to=flow.nodes.find(n=>n.id===$('toNode').value);$('fromPort').replaceChildren();const list=Object.keys(component(from||{})?.output_schema.properties||{});if(!list.includes('output'))list.push('output');if(from?.on_error==='route')list.push('error');list.forEach(p=>option($('fromPort'),p,p));$('inputPorts').replaceChildren();Object.keys(component(to||{})?.input_schema.properties||{}).forEach(p=>option($('inputPorts'),p,p));if(!$('toPort').value)$('toPort').value='input'}
function inspect(){const n=flow.nodes.find(n=>n.id===selected);$('configFields').replaceChildren();if(!n){$('selectedTitle').textContent='选择节点编辑';return}const c=component(n);$('selectedTitle').textContent=n.component+' @ '+n.version;$('nodeId').value=n.id;$('join').value=n.join||'all';$('onError').value=n.on_error||'fail';$('bindings').value=JSON.stringify(n.bindings||{},null,2);$('nodeSchema').value=JSON.stringify(n.input_schema||{},null,2);const props=c?.config_schema.properties||{};for(const key of new Set([...Object.keys(props),...Object.keys(n.config||{})])){const spec=props[key]||{};const l=document.createElement('label');l.textContent=spec.title||key;const input=document.createElement('input');input.dataset.key=key;input.dataset.type=spec.type||'json';input.setAttribute('aria-label',key);const value=n.config[key]??spec.default;input.value=value===undefined?'':spec.type==='string'?value:JSON.stringify(value);$('configFields').append(l,input)}}
function applyNode(){const n=flow.nodes.find(n=>n.id===selected);if(!n)throw Error('请先选择节点');const id=$('nodeId').value.trim();if(!id||flow.nodes.some(x=>x!==n&&x.id===id))throw Error('节点 ID 不能为空或重复');const old=n.id;for(const e of flow.edges){if(e.from.node===old)e.from.node=id;if(e.to.node===old)e.to.node=id}if(flow.entry===old)flow.entry=id;if(flow.exit===old)flow.exit=id;n.id=id;selected=id;n.join=$('join').value;n.on_error=$('onError').value;n.bindings=JSON.parse($('bindings').value);n.input_schema=JSON.parse($('nodeSchema').value);n.config={};for(const input of $('configFields').querySelectorAll('input')){if(input.value!=='')n.config[input.dataset.key]=input.dataset.type==='string'?input.value:JSON.parse(input.value)}render();notice('节点配置已应用')}
async function validate(){const result=await api('/v1/workflows/validate','POST',meta());$('validation').textContent=result.valid?'校验通过':result.errors.join('\n');notice(result.valid?'校验通过，可发布此版本':'校验未通过，请检查端口与配置',!result.valid);return result}
action('refresh',refresh);$('search').oninput=catalog;action('load',()=>{const item=saved[Number($('saved').value)];if(item)load(item.workflow,item.revision||0)});action('new',()=>load(blank()));action('apply',applyNode);action('applySchema',()=>{flow.input_schema=JSON.parse($('inputSchema').value);flow.output_schema=JSON.parse($('outputSchema').value);flow.max_parallel=Number($('parallel').value);notice('流程契约已应用')});action('entry',()=>{flow.entry=selected||'';render()});action('exit',()=>{flow.exit=selected||'';render()});action('remove',()=>{flow.nodes=flow.nodes.filter(n=>n.id!==selected);flow.edges=flow.edges.filter(e=>e.from.node!==selected&&e.to.node!==selected);selected=null;render();inspect()});$('fromNode').onchange=ports;$('toNode').onchange=ports;
action('connect',async()=>{flow.edges.push({from:{node:$('fromNode').value,port:$('fromPort').value},to:{node:$('toNode').value,port:$('toPort').value.trim()}});render();await validate()});action('validate',validate);action('save',async()=>{const result=await api('/v1/workbench/draft','PUT',{workflow:meta(),revision});revision=result.revision;await refresh();notice('草稿已保存，修订 '+revision)});action('publish',async()=>{if(!(await validate()).valid)return;await api('/v1/workflows/publish','POST',meta());await refresh();notice('版本已发布。可执行验证，再选择启用。')});action('activate',async()=>{meta();await api('/v1/workbench/activate','POST',{id:flow.id,version:flow.version,enabled:true});notice('新请求将使用此版本；已提交任务保持原版本。')});action('disable',async()=>{meta();await api('/v1/workbench/activate','POST',{id:flow.id,version:flow.version,enabled:false});notice('已停用此流程的新请求。')});action('register',async()=>{await api('/v1/components/register','POST',JSON.parse($('manifest').value));await refresh()});
action('export',()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(meta(),null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=flow.id+'.json';a.click();URL.revokeObjectURL(url)});action('import',()=>$('file').click());$('file').onchange=async()=>{try{const file=$('file').files[0];if(file.size>2000000)throw Error('导入文件过大');const value=JSON.parse(await file.text());if(!Array.isArray(value.nodes)||!Array.isArray(value.edges))throw Error('不是 Workflow 清单');load(value);await validate()}catch(e){notice(e.message,true)}};
async function watch(){if(!runId)return;try{const run=await api('/v1/runs/'+runId);currentRun=run;$('runResult').textContent=JSON.stringify({id:run.id,status:run.status,output:run.output,error:run.error,nodes:run.execution_state.workflow?.nodes},null,2);for(const node of $('nodes').children)node.dataset.status=run.execution_state.workflow?.nodes[node.dataset.node]?.status||'';const waiting=run.status==='waiting_approval';$('approve').hidden=$('reject').hidden=!waiting;if(['succeeded','failed','cancelled','timed_out'].includes(run.status)||waiting){clearInterval(poll);$('cancel').disabled=!waiting;return}}catch(e){clearInterval(poll);notice(e.message,true)}}
action('execute',async()=>{meta();const run=await api('/v1/workbench/execute/'+encodeURIComponent(flow.id)+'/'+flow.version,'POST',{tenant_id:$('runTenant').value,agent_id:$('profile').value,input:JSON.parse($('runInput').value)});runId=run.id;$('cancel').disabled=false;clearInterval(poll);poll=setInterval(watch,800);await watch()});action('cancel',async()=>{await api('/v1/runs/'+runId+'/cancel','POST');await watch()});for(const id of ['approve','reject'])action(id,async()=>{const approval=currentRun?.execution_state.workflow?.approval;if(!approval)throw Error('无待审批节点');await api('/v1/approvals/'+approval.id,'POST',{approved:id==='approve',comment:'Workflow 工作台人工审批'});$('approve').hidden=$('reject').hidden=true;poll=setInterval(watch,800);await watch()});
refresh().catch(e=>notice(e.message,true));
</script></html>
